version: "3.9"

services:
  spandana:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: spandana-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/uploads:/app/backend/uploads
      - spandana-logs:/var/log/spandana
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production

  # Optional: MongoDB (or use MongoDB Atlas instead)
  # mongodb:
  #   image: mongo:7
  #   container_name: spandana-mongo
  #   restart: unless-stopped
  #   volumes:
  #     - mongo-data:/data/db
  #   environment:
  #     MONGO_INITDB_DATABASE: spandana

  # Nginx reverse proxy (optional if hosting on VPS)
  nginx:
    image: nginx:alpine
    container_name: spandana-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/spandana.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/html:ro
    depends_on:
      - spandana

volumes:
  spandana-logs:
  # mongo-data:
